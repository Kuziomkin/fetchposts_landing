---
layout: default
---
<article class="py-20 bg-white dark:bg-surface-dark">
    <div class="mx-auto max-w-3xl px-6 lg:px-8">
        <div class="mb-10 text-center">
            {% if page.image %}
            <img src="{{ page.image | relative_url }}" alt="{{ page.title }}"
                class="w-full h-auto max-h-[500px] object-cover object-top rounded-xl shadow-lg mb-8" />
            {% endif %}
            <p class="text-sm text-gray-500 mb-2">{{ page.date | date: "%B %d, %Y" }}</p>
            <h1 class="font-display text-4xl font-bold tracking-tight text-black dark:text-white sm:text-5xl mb-6">{{
                page.title }}</h1>
            {% if page.description %}
            <p class="text-xl text-gray-600 dark:text-gray-300">{{ page.description }}</p>
            {% endif %}
        </div>

        <div class="prose prose-lg prose-blue dark:prose-invert mx-auto">
            {{ content }}
        </div>
    </div>
</article>
